# Manual release from main (see openspec/specs/release-process):
#   1. prepare:         compute the version yyyy.mm.rm, move the
#      [Unreleased] entries of CHANGELOG.md into a release section, create
#      rel-<version> with a commit of VERSION and CHANGELOG.md
#   2. build:            build and test on rel-<version>, package the assets
#   3. publish:          GitHub release <version> with the zips and
#      SHA256SUMS.txt; notes = download header + changelog section +
#      generated notes
#   4. sync-changelog:   push rel-<version>'s CHANGELOG.md back to main as
#      its own commit, keeping any entries merged to main since rel-<version>
#      branched under [Unreleased] (scripts/changelog.sh backport). Retries
#      on a race with a concurrent push to main. A failure here does not
#      undo the published release; see the step summary for the manual
#      fallback (README, "Making a release").
#   5. cleanup:          on failure of prepare/build/publish, remove the
#      release branch (and tag/release)

name: Release

on:
  workflow_dispatch:

# One release at a time, so two runs never compute the same version.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  prepare:
    name: Create release branch
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.version.outputs.version }}
      sha: ${{ steps.branch.outputs.sha }}
    steps:
      - name: Releases are only made from main
        if: github.ref != 'refs/heads/main'
        env:
          REF: ${{ github.ref }}
        run: |
          echo "::error title=Wrong branch::Releases are only made from main (started on $REF)"
          exit 1

      - name: Check out main
        uses: actions/checkout@v4

      - name: Compute version
        id: version
        run: |
          version="$(git ls-remote origin 'refs/heads/rel-*' 'refs/tags/*' | scripts/next-version.sh)"
          if [[ ! "$version" =~ ^[0-9]{4}\.[0-9]{2}\.[0-9]+$ ]]; then
            echo "::error::unexpected version '$version'"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Release version: $version" >> "$GITHUB_STEP_SUMMARY"

          # Previous release: highest yyyy.mm.rm tag (empty before the first).
          previous="$(git ls-remote --tags origin \
            | awk '{ sub("^refs/tags/", "", $2); print $2 }' \
            | { grep -E '^[0-9]{4}\.[0-9]{2}\.(0|[1-9][0-9]*)$' || true; } \
            | sort -t. -k1,1n -k2,2n -k3,3n | tail -n 1)"
          echo "previous=$previous" >> "$GITHUB_OUTPUT"
          echo "Previous release: ${previous:-none}" >> "$GITHUB_STEP_SUMMARY"

      # Runs the script's tests with this runner's awk (mawk), which local
      # "make test" on macOS does not cover.
      - name: Test changelog script
        run: bash tests/scripts/test-changelog.sh

      # Fails (before any branch exists) if [Unreleased] is empty or the
      # previous release's CHANGELOG.md was not copied back to main.
      - name: Update changelog
        env:
          VERSION: ${{ steps.version.outputs.version }}
          PREVIOUS: ${{ steps.version.outputs.previous }}
        run: |
          if ! scripts/changelog.sh release "$VERSION" "$(date -u +%F)" "$PREVIOUS"; then
            echo "::error title=CHANGELOG.md::See the message above. Add entries under [Unreleased], or bring CHANGELOG.md from rel-$PREVIOUS back to main in a pull request, keeping entries merged since then under [Unreleased] (README, \"Making a release\")."
            exit 1
          fi
          scripts/changelog.sh section "$VERSION" >> "$GITHUB_STEP_SUMMARY"

      - name: Create release branch
        id: branch
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "rel-$VERSION"
          printf '%s\n' "$VERSION" > VERSION
          git add VERSION CHANGELOG.md
          git commit -m "chore(release): $VERSION"
          git push origin "rel-$VERSION"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  build:
    name: Build release
    needs: prepare
    runs-on: macos-15
    timeout-minutes: 45
    env:
      RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - name: Check out release branch
        uses: actions/checkout@v4
        with:
          ref: rel-${{ needs.prepare.outputs.version }}

      - name: Check VERSION file
        run: |
          if [[ "$(cat VERSION)" != "$RELEASE_VERSION" ]]; then
            echo "::error::VERSION file does not contain $RELEASE_VERSION"
            exit 1
          fi

      - name: Build and test
        uses: ./.github/actions/build-and-test

      - name: Package release assets
        run: scripts/package-release.sh "$RELEASE_VERSION"

      - name: Upload release assets
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ needs.prepare.outputs.version }}
          path: build/release/
          retention-days: 1
          if-no-files-found: error

  publish:
    name: Publish release
    needs: [prepare, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out release branch
        uses: actions/checkout@v4
        with:
          ref: rel-${{ needs.prepare.outputs.version }}

      - name: Download release assets
        uses: actions/download-artifact@v4
        with:
          name: release-${{ needs.prepare.outputs.version }}
          path: release

      - name: Create GitHub release
        run: |
          # Header without its licence comment, with the version filled in,
          # then the version's CHANGELOG.md section; gh appends the
          # generated notes.
          {
            sed -e '/^<!--/,/^-->/d' -e "s/<version>/$RELEASE_VERSION/g" \
                .github/release-notes-header.md
            printf "\n## What's new in %s\n\n" "$RELEASE_VERSION"
            scripts/changelog.sh section "$RELEASE_VERSION"
          } > "$RUNNER_TEMP/notes.md"
          gh release create "$RELEASE_VERSION" \
            release/raspir-blaster-"$RELEASE_VERSION"-sdcard.zip \
            release/raspir-blaster-"$RELEASE_VERSION"-cm4-emmc.zip \
            release/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" \
            --target "rel-$RELEASE_VERSION" \
            --title "raspir-blaster $RELEASE_VERSION" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            --generate-notes
          echo "Published release $RELEASE_VERSION" >> "$GITHUB_STEP_SUMMARY"

  sync-changelog:
    name: Sync changelog back to main
    needs: [prepare, build, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Bring CHANGELOG.md back to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin "rel-$RELEASE_VERSION" --depth 1
          git show "origin/rel-$RELEASE_VERSION:CHANGELOG.md" > "$RUNNER_TEMP/released-changelog.md"

          # Retries: other pull requests may merge to main (adding their own
          # [Unreleased] entries) while this release was building.
          for attempt in 1 2 3 4 5; do
            git fetch origin main --depth 1
            git reset --hard origin/main

            scripts/changelog.sh backport "$RUNNER_TEMP/released-changelog.md"
            if git diff --quiet -- CHANGELOG.md; then
              echo "CHANGELOG.md on main already has release $RELEASE_VERSION" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi

            git commit -am "docs(changelog): bring back $RELEASE_VERSION"
            if git push origin HEAD:main; then
              echo "Synced CHANGELOG.md for $RELEASE_VERSION back to main" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi

            echo "push to main raced with another commit, attempt $attempt/5, retrying" >&2
            sleep $((attempt * 5))
          done

          echo "::error::could not push CHANGELOG.md for $RELEASE_VERSION to main after 5 attempts" \
            "(bring it back manually: git checkout rel-$RELEASE_VERSION -- CHANGELOG.md, see README \"Making a release\")"
          exit 1

  cleanup:
    name: Clean up failed release
    needs: [prepare, build, publish]
    if: (failure() || cancelled()) && needs.prepare.outputs.version != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
      BRANCH_SHA: ${{ needs.prepare.outputs.sha }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Delete release, tag and branch
        run: |
          repo="$GITHUB_REPOSITORY"

          # Only delete refs that point to this run's commit, never another run's.
          ref_sha() {
            gh api "repos/$repo/git/ref/$1" --jq '.object.sha' 2>/dev/null || true
          }

          gh release delete "$RELEASE_VERSION" --repo "$repo" --yes 2>/dev/null \
            && echo "deleted release $RELEASE_VERSION" || true

          if [[ -n "$BRANCH_SHA" && "$(ref_sha "tags/$RELEASE_VERSION")" == "$BRANCH_SHA" ]]; then
            gh api -X DELETE "repos/$repo/git/refs/tags/$RELEASE_VERSION"
            echo "deleted tag $RELEASE_VERSION"
          fi

          if [[ -n "$BRANCH_SHA" && "$(ref_sha "heads/rel-$RELEASE_VERSION")" == "$BRANCH_SHA" ]]; then
            gh api -X DELETE "repos/$repo/git/refs/heads/rel-$RELEASE_VERSION"
            echo "deleted branch rel-$RELEASE_VERSION"
          fi

          echo "Release $RELEASE_VERSION failed; release branch removed" >> "$GITHUB_STEP_SUMMARY"
