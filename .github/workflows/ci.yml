# Builds and tests every push (feature branches, and main after a merged
# pull request). Release branches are built by release.yml.
# See openspec/specs/continuous-integration.

name: CI

on:
  push:
    branches-ignore:
      - 'rel-*'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build and test
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Build and test
        uses: ./.github/actions/build-and-test

      - name: Short commit hash
        id: commit
        shell: bash
        run: echo "short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Upload kernel images
        uses: actions/upload-artifact@v4
        with:
          name: firmware-images-${{ steps.commit.outputs.short }}
          path: build/images/
          retention-days: 7
          if-no-files-found: error
